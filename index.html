*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070b14;--card:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.07);--text:#e8e6e3;--sub:rgba(200,210,230,0.45);--dim:rgba(200,210,230,0.25);--blue:#2d4a8a;--gold:#8a6d2d;--accent:#ffd07a}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
#app{min-height:100vh;background:linear-gradient(170deg,#070b14 0%,#0e1528 40%,#0a1020 100%);position:relative}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:20px 16px;min-height:100vh;display:flex;flex-direction:column}
.wrap.center{justify-content:center;align-items:center;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;backdrop-filter:blur(12px)}
.btn{width:100%;padding:14px 20px;background:linear-gradient(135deg,var(--blue),#1a3066);border:1px solid rgba(100,140,255,0.3);border-radius:12px;color:#e0e8ff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(0.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#66501a);border-color:rgba(255,200,100,0.3);color:#fff3d4}
.btn-off{opacity:.35;cursor:not-allowed}
.btn-sm{padding:10px 16px;font-size:13px}
.title{font-size:28px;font-weight:800;background:linear-gradient(135deg,#c8d8ff,#ffd4a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-.5px}
.back-btn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px;margin-bottom:16px;font-family:inherit;text-align:left;padding:0}
.input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e0e8ff;font-size:14px;font-family:inherit;outline:none}
.input:focus{border-color:rgba(100,140,255,0.4)}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;transition:all .3s}
.dot.done{background:#6faaff}
.dot.active{background:#ffd07a;box-shadow:0 0 8px rgba(255,208,122,.5)}
.dot.idle{background:rgba(255,255,255,.12)}
.option-btn{width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#e0e8ff;font-size:15px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.option-btn:active{background:rgba(255,255,255,0.08)}
.option-btn.correct{background:rgba(80,200,120,0.2);border-color:rgba(80,200,120,0.5)}
.option-btn.wrong{background:rgba(255,80,80,0.2);border-color:rgba(255,80,80,0.5);animation:shake .3s ease}
.team-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.team-btn{padding:14px 8px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;font-family:inherit;color:#e0e8ff}
.team-btn.sel{background:rgba(255,255,255,0.06)}
.team-circle{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.badge{padding:3px 10px;border-radius:16px;font-size:11px;border:1px solid}
.badge-on{background:rgba(80,200,120,0.15);color:#6fdf8a;border-color:rgba(80,200,120,0.25)}
.badge-off{background:rgba(255,255,255,0.04);color:var(--sub);border-color:rgba(255,255,255,0.06)}
.flash-circle{width:110px;height:110px;border-radius:50%;margin:16px auto;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;font-size:36px}
.flash-off{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1)}
.flash-on{background:radial-gradient(circle,#fffbe0 0%,#ffd54f 30%,rgba(255,213,79,0.3) 60%,transparent 80%);border:2px solid rgba(255,213,79,0.6);box-shadow:0 0 50px rgba(255,213,79,0.4)}
#qr-reader{width:100%;max-width:280px;margin:0 auto 16px;border-radius:12px;overflow:hidden}
#qr-reader video{border-radius:12px}
/* 별 배경 */
.starfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
/* QR 인쇄 */
.qr-print-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qr-item{text-align:center;padding:12px;background:white;border-radius:8px;break-inside:avoid}
.qr-item canvas{display:block;margin:0 auto 8px}
.qr-item p{color:#333;font-size:12px;font-weight:600;margin:0}
.qr-item small{color:#666;font-size:10px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media print{.no-print{display:none!important}.qr-print-grid{grid-template-columns:1fr 1fr 1fr}}
</style>

  adminTaps: 0, tapTimer: null, qrScanning: false,
  // Firestore에서 실시간으로 받아오는 팀 데이터
  teamData: {} // { team_0: {members, stage, arrived}, ... }
};

let db, storage, unsubTeams, unsubState;

// ════════════════════════════════════════════════
//  Firebase
// ════════════════════════════════════════════════
function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    storage = firebase.storage();
    console.log('Firebase 초기화 완료');
  } catch(e) {
    console.warn('Firebase 초기화 실패:', e.message);
  }
}

// 팀 등록
async function registerTeam(teamNum, members) {
  if (!db) return;
  const id = 'team_' + teamNum;
  await db.collection(COLLECTION).doc(id).set({
    teamNumber: teamNum,
    members: members.filter(m => m.trim()),
    currentStage: 0,
    arrived: false,
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// 스테이지 업데이트
async function updateStage(teamNum, newStage) {
  if (!db) return;
  await db.collection(COLLECTION).doc('team_' + teamNum).update({ currentStage: newStage });
}

// 최종 도착 기록
async function markArrived(teamNum) {
  if (!db) return;
  await db.collection(COLLECTION).doc('team_' + teamNum).update({ arrived: true });
}

// 관리자: 메시지 전송
async function sendMessage() {
  if (!db) return;
  await db.collection(COLLECTION).doc('_state').set({ messageSent: true, photoUrl: S.photoUrl || '' }, { merge: true });
}

// 관리자: 사진 업로드
async function uploadPhoto(file) {
  if (!storage) return null;
  const ref = storage.ref().child('starnight/result_' + Date.now() + '.jpg');
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await db.collection(COLLECTION).doc('_state').set({ photoUrl: url }, { merge: true });
  return url;
}

// 관리자: 게임 초기화
async function resetGame() {
  if (!db) return;
  const batch = db.batch();
  batch.set(db.collection(COLLECTION).doc('_state'), { messageSent: false, photoUrl: '' });
  for (let i = 0; i < 10; i++) {
    batch.delete(db.collection(COLLECTION).doc('team_' + i));
  }
  await batch.commit();
}

// 실시간 리스너: 팀 상태
function listenTeams() {
  if (!db) return;
  unsubTeams = db.collection(COLLECTION)
    .where(firebase.firestore.FieldPath.documentId(), '!=', '_state')
    .onSnapshot(snap => {
      const newArrived = Array(10).fill(false);
      const teamData = {};
      snap.forEach(doc => {
        const d = doc.data();
        const idx = d.teamNumber;
        if (idx !== undefined) {
          newArrived[idx] = !!d.arrived;
          teamData['team_' + idx] = d;
        }
      });
      S.arrived = newArrived;
      S.teamData = teamData;
      if (S.view !== 'scan') render();
    });
}

// 실시간 리스너: 게임 상태 (메시지/사진)
function listenState() {
  if (!db) return;
  unsubState = db.collection(COLLECTION).doc('_state').onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      S.msgSent = !!d.messageSent;
      S.photoUrl = d.photoUrl || '';
      if (S.view !== 'scan') render();
    }
  });
}

// ════════════════════════════════════════════════
//  QR 스캐너
// ════════════════════════════════════════════════
let qrScanner = null;
let qrStopping = false;

function startQrScan(onResult) {
  const el = document.getElementById('qr-reader');
  if (!el || qrStopping) return;
  try {
    qrScanner = new Html5Qrcode('qr-reader');
    qrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decoded) => {
        const code = decoded.trim();
        stopQrScan();
        onResult(code);
      },
      () => {}
    ).catch(err => {
      console.warn('카메라 접근 실패:', err);
      // 카메라 실패해도 render 하지 않음 — 수동 입력이 이미 표시되어 있음
      qrScanner = null;
    });
  } catch(e) {
    console.warn('QR 초기화 실패:', e);
    qrScanner = null;
  }
}

function stopQrScan() {
  if (qrStopping) return;
  const scanner = qrScanner;
  qrScanner = null;
  if (!scanner) return;
  qrStopping = true;
  try {
    scanner.stop().then(() => {
      try { scanner.clear(); } catch(e) {}
      qrStopping = false;
    }).catch(() => {
      try { scanner.clear(); } catch(e) {}
      qrStopping = false;
    });
  } catch(e) {
    qrStopping = false;
  }
}

// ════════════════════════════════════════════════
//  손전등(토치) 제어
// ════════════════════════════════════════════════
let torchStream = null;
let torchTrack = null;

async function torchOn() {
  // 방법 1: 카메라 토치 API (Android Chrome 등)
  try {
    torchStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    torchTrack = torchStream.getVideoTracks()[0];
    const caps = torchTrack.getCapabilities ? torchTrack.getCapabilities() : {};
    if (caps.torch) {
      await torchTrack.applyConstraints({ advanced: [{ torch: true }] });
      console.log('토치 ON');
      return true;
    }
  } catch(e) {
    console.warn('토치 API 실패:', e);
  }
  // 토치 미지원 시 → 화면을 밝게 (폴백)
  return false;
}

function torchOff() {
  if (torchTrack) {
    try { torchTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch(e) {}
    try { torchTrack.stop(); } catch(e) {}
    torchTrack = null;
  }
  if (torchStream) {
    torchStream.getTracks().forEach(t => t.stop());
    torchStream = null;
  }
}

// ════════════════════════════════════════════════
//  별 배경 생성
// ════════════════════════════════════════════════
const STAR_FIELD = Array.from({length:90}, () => ({
  x: Math.random()*100, y: Math.random()*100,
  r: Math.random()*2+0.4, d: Math.random()*4, t: Math.random()*2.5+1.5
}));

function starFieldSVG() {
  return `<div class="starfield"><svg width="100%" height="100%" style="position:absolute">${
    STAR_FIELD.map(s => `<circle cx="${s.x}%" cy="${s.y}%" r="${s.r}" fill="white" opacity=".5"><animate attributeName="opacity" values=".2;.8;.2" dur="${s.t}s" begin="${s.d}s" repeatCount="indefinite"/></circle>`).join('')
  }</svg></div>`;
}

// ════════════════════════════════════════════════
//  별자리 SVG (관리자 전용)
// ════════════════════════════════════════════════
function constellationSVG(arr, width) {
  const w = width || 360;
  let svg = `<svg viewBox="-10 -10 520 450" width="${w}" style="margin:0 auto;display:block">`;
  // 삼각형 점선
  TRI_LINES.forEach(([a,b]) => {
    const on = arr[a] && arr[b];
    svg += `<line x1="${POS[a].x}" y1="${POS[a].y}" x2="${POS[b].x}" y2="${POS[b].y}" stroke="${on?'rgba(255,200,100,0.25)':'rgba(255,255,255,0.05)'}" stroke-width="1" stroke-dasharray="8,6"/>`;
  });
  // 백조자리 실선
  CYGNUS_LINES.forEach(([a,b]) => {
    const on = arr[a] && arr[b];
    svg += `<line x1="${POS[a].x}" y1="${POS[a].y}" x2="${POS[b].x}" y2="${POS[b].y}" stroke="${on?'rgba(180,210,255,0.5)':'rgba(255,255,255,0.07)'}" stroke-width="${on?2:1}" stroke-dasharray="${on?'none':'4,4'}"/>`;
  });
  // 별
  POS.forEach((p,i) => {
    if (arr[i]) {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="16" fill="none" stroke="rgba(255,220,100,0.3)" stroke-width="1"><animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;.1;.4" dur="2s" repeatCount="indefinite"/></circle>`;
    }
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${arr[i]?6:3.5}" fill="${arr[i]?'#ffd54f':'rgba(255,255,255,0.18)'}" style="transition:all .5s;${arr[i]?'filter:drop-shadow(0 0 5px rgba(255,213,79,0.7))':''}"/>`;
    svg += `<text x="${p.x}" y="${p.y-12}" text-anchor="middle" font-size="10" fill="${arr[i]?'#ffd07a':'rgba(255,255,255,0.2)'}" font-family="'Noto Sans KR',sans-serif">${i+1}모둠</text>`;
    svg += `<text x="${p.x}" y="${p.y+18}" text-anchor="middle" font-size="8" fill="${arr[i]?'rgba(255,208,122,0.6)':'rgba(255,255,255,0.12)'}" font-family="'Noto Sans KR',sans-serif">${STARS_ADMIN[i].ko}</text>`;
  });
  svg += `<text x="250" y="435" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.12)" font-family="'Noto Sans KR',sans-serif">여름 대삼각형 + 백조자리</text>`;
  svg += `</svg>`;
  return svg;
}

      <h3 style="font-size:20px;font-weight:700;margin-bottom:12px;color:#ff8a8a">잘못된 QR코드입니다</h3>

      <button class="btn" onclick="go('scan')">다시 스캔하기</button>
      <button class="back-btn" style="text-align:center;width:100%;margin-top:12px" onclick="go('hint')">힌트 다시 보기</button>
    </div>
  </div>`;
}

// ── 최종 도착 & 대기 ──
function renderArrived() {
  const cnt = S.arrived.filter(Boolean).length;
  app().innerHTML = starFieldSVG() + `
  <div class="wrap center">
    <div class="card" style="text-align:center">
      ${!S.msgSent ? `
        <div style="font-size:48px;margin-bottom:12px">🎉</div>
        <h2 class="title" style="font-size:22px">${S.team+1}모둠 도착 완료!</h2>
        <p style="font-size:14px;color:var(--sub);margin-bottom:24px">최종 목적지에 도착했습니다</p>
        <div style="background:rgba(100,140,255,0.07);border:1px solid rgba(100,140,255,0.18);border-radius:12px;padding:24px;margin-bottom:16px">
          <div style="margin-bottom:12px"><span style="animation:pulse 1.5s ease infinite;font-size:32px">⏳</span></div>
          <p style="font-size:16px;font-weight:700;color:#a0c4ff;margin-bottom:8px">다른 모둠을 기다리는 중입니다</p>
          <p style="font-size:13px;color:var(--dim);line-height:1.6">모든 모둠이 목적지에 도착할 때까지<br>현재 위치에서 대기해 주세요!</p>
        </div>
        <div style="font-size:13px;color:var(--dim)">현재 도착: ${cnt} / 10 모둠</div>
      ` : `
        <div style="font-size:20px;margin-bottom:8px">📢</div>
        <h2 class="title" style="font-size:22px">미션이 도착했습니다!</h2>
        <div style="background:rgba(255,200,80,0.07);border:1px solid rgba(255,200,80,0.18);border-radius:12px;padding:24px;margin:16px 0">
          <p style="font-size:18px;font-weight:700;color:var(--accent);margin-bottom:12px;line-height:1.6">📱 옥상에 있는 선생님을 향해<br>핸드폰 라이트를 비춰주세요!</p>
          <p style="font-size:13px;color:var(--sub)">여러분의 빛이 하나의 작품이 됩니다</p>
        </div>
        <div class="flash-circle ${S.flashOn?'flash-on':'flash-off'}" id="flash-btn">${S.flashOn?'💡':'🔦'}</div>
        <p id="flash-status" style="font-size:11px;color:var(--dim);margin-bottom:16px">${S.flashOn?'손전등 ON — 다시 터치하면 꺼집니다':'터치하여 손전등 켜기'}</p>
        ${S.flashOn ? '<div id="bright-screen" style="position:fixed;inset:0;background:#fff;opacity:0.15;z-index:0;pointer-events:none"></div>' : ''}
        ${S.photoUrl ? `
          <div style="margin-top:12px">
            <h3 style="font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px">🌌 우리가 만든 작품</h3>
            <img src="${S.photoUrl}" alt="결과" style="width:100%;border-radius:12px;display:block">
          </div>
        ` : ''}
      `}
    </div>
  </div>`;
  const fb = $('flash-btn');
  if (fb) fb.addEventListener('click', async () => {
    if (S.flashOn) {
      // 끄기
      torchOff();
      S.flashOn = false;
      render();
    } else {
      // 켜기
      const torchOk = await torchOn();
      S.flashOn = true;
      render();
      if (!torchOk) {
        // 토치 미지원 안내
        const st = $('flash-status');
        if (st) st.textContent = '📱 직접 손전등 앱을 켜주세요!';
      }
    }
  });
}

// ── 관리자 ──
function renderAdmin() {
  const cnt = S.arrived.filter(Boolean).length;
  const allOk = S.arrived.every(Boolean);
  app().innerHTML = starFieldSVG() + `
  <div class="wrap no-print">
    <button class="back-btn" onclick="go('splash')">← 나가기</button>
    <h2 class="title">🔭 관리자 모드</h2>
    <p style="font-size:14px;color:var(--sub);margin-bottom:24px;line-height:1.5">여름 대삼각형 + 백조자리 (10모둠)</p>

    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;color:var(--sub);margin-bottom:12px">별자리 완성 현황</h3>
      ${constellationSVG(S.arrived, 360)}
    </div>

    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;color:var(--sub);margin-bottom:12px">모둠별 현황 <span style="font-size:11px">(터치 토글)</span></h3>
      ${STARS_ADMIN.map((s,i) => {
        const td = S.teamData['team_'+i];
        const names = td ? td.members?.join(', ') : '';
        return `
        <div class="team-row" data-idx="${i}" style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;${i<9?'border-bottom:1px solid rgba(255,255,255,0.04)':''}; cursor:pointer">
          <div>
            <span style="font-weight:700;color:${COLORS[i]}">${i+1}모둠</span>
            <span style="font-size:11px;color:var(--dim);margin-left:6px">${s.ko} · ${s.part}</span>
            ${names ? `<div style="font-size:11px;color:var(--dim);margin-top:2px">👤 ${names}</div>` : ''}
          </div>
          <span class="badge ${S.arrived[i]?'badge-on':'badge-off'}">${S.arrived[i]?'도착 ✓':'이동 중'}</span>
        </div>`;
      }).join('')}
      <div style="text-align:center;margin-top:10px;font-size:13px;color:var(--dim)">${cnt} / 10 모둠 도착</div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;color:var(--sub);margin-bottom:12px">📢 학생에게 메시지 전송</h3>
      ${S.msgSent ? `
        <div style="text-align:center;padding:12px 0">
          <div style="font-size:24px;margin-bottom:8px">✅</div>
          <p style="font-size:14px;color:#6fdf8a">메시지가 전송되었습니다</p>
          <p style="font-size:12px;color:var(--dim);margin-top:4px">"옥상에 있는 선생님을 향해 핸드폰 라이트를 비춰주세요"</p>
        </div>
      ` : `
        <p style="font-size:13px;color:var(--dim);margin-bottom:12px;line-height:1.5">${allOk?'모든 모둠이 도착했습니다! 메시지를 전송하세요.':'모든 모둠이 도착하면 버튼이 활성화됩니다.'}</p>
        <button class="btn btn-gold ${allOk?'':'btn-off'}" id="send-msg-btn">${allOk?'📢 라이트 비추기 메시지 전송':'⏳ 대기 중 ('+cnt+'/10)'}</button>
      `}
    </div>

    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;color:var(--sub);margin-bottom:12px">📸 결과 사진 업로드</h3>
      ${S.photoUrl ? `
        <img src="${S.photoUrl}" alt="업로드됨" style="width:100%;border-radius:12px;margin-bottom:12px">
        <p style="font-size:12px;color:#6fdf8a;text-align:center">✅ 사진이 업로드되었습니다</p>
      ` : `
        <input type="file" accept="image/*" id="photo-input" style="display:none">
        <button class="btn" id="photo-btn">사진 선택</button>
      `}
    </div>

    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;color:var(--sub);margin-bottom:12px">🏷️ QR코드 생성 / 인쇄</h3>
      <button class="btn btn-sm" onclick="go('adminQr')">QR코드 관리 페이지</button>
    </div>

    <div class="card">
      <h3 style="font-size:14px;color:var(--sub);margin-bottom:12px">⚙️ 게임 관리</h3>
      <button class="btn btn-sm" id="reset-btn" style="background:rgba(255,80,80,0.1);border-color:rgba(255,80,80,0.2);color:rgba(255,150,150,0.7)">🔄 게임 초기화 (모든 데이터 삭제)</button>
    </div>
  </div>`;

  // 이벤트
  document.querySelectorAll('.team-row').forEach(row => {
    row.addEventListener('click', () => {
      const i = +row.dataset.idx;
      S.arrived[i] = !S.arrived[i];
      // Firestore에도 반영
      if (db) db.collection(COLLECTION).doc('team_'+i).set({teamNumber:i, arrived:S.arrived[i]},{merge:true});
      render();
    });
  });

  const sendBtn = $('send-msg-btn');
  if (sendBtn && allOk) sendBtn.addEventListener('click', () => { sendMessage(); S.msgSent = true; render(); });

  const photoBtn = $('photo-btn');
  const photoInput = $('photo-input');
  if (photoBtn && photoInput) {
    photoBtn.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      photoBtn.textContent = '업로드 중...';
      photoBtn.classList.add('btn-off');
      try {
        const url = await uploadPhoto(file);
        if (url) { S.photoUrl = url; render(); }
      } catch(err) {
        // Storage 안 되면 로컬 미리보기
        S.photoUrl = URL.createObjectURL(file);
        render();
      }
    });
  }

  const resetBtn = $('reset-btn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (confirm('정말로 모든 게임 데이터를 초기화하시겠습니까?')) {
      resetGame();
      S.arrived = Array(10).fill(false);
      S.msgSent = false;
      S.photoUrl = '';
      S.teamData = {};
      render();
    }
  });
}

// ── 관리자 QR코드 ──
function renderAdminQr() {
  // 모든 QR코드 목록 생성
  let qrList = [];
  QUIZZES.forEach((teamQ, ti) => {
    teamQ.forEach((q, si) => {
      qrList.push({
        code: q.qrId,
        team: ti + 1,
        stage: si === 3 ? '최종' : `${si+1}단계`,
        hint: q.hint.replace(/[📚🔬🎵🎨🍽️💻🏃📺⭐]/g, '').trim()
      });
    });
  });

  app().innerHTML = `
  <div class="wrap no-print">
    <button class="back-btn" onclick="go('admin')">← 관리자 패널</button>
    <h2 class="title">🏷️ QR코드 관리</h2>
    <p style="font-size:14px;color:var(--sub);margin-bottom:16px;line-height:1.5">각 QR코드를 인쇄하여 해당 장소에 부착하세요</p>
    <button class="btn" style="margin-bottom:24px" onclick="window.print()">🖨️ 인쇄하기</button>
  </div>
  <div class="qr-print-grid" style="max-width:800px;margin:0 auto;padding:0 16px 40px" id="qr-grid">
    ${qrList.map(q => `
      <div class="qr-item">
        <div id="qr-${q.code}" style="margin:0 auto 8px;width:150px;height:150px"></div>
        <p>${q.team}모둠 ${q.stage}</p>
        <p style="font-size:14px;font-weight:800;color:#000;margin-top:4px">${q.code}</p>
        <small>${q.hint.substring(0, 30)}...</small>
      </div>
    `).join('')}
  </div>`;

  // QR코드 생성 (html5-qrcode의 QR 생성은 별도 라이브러리 필요하므로 canvas로 간단 구현)
  qrList.forEach(q => {
    const el = document.getElementById('qr-' + q.code);
    if (el && typeof QRCode !== 'undefined') {
      new QRCode(el, { text: q.code, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
    } else if (el) {
      // QRCode 라이브러리 없으면 텍스트 표시
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      el.style.border = '2px dashed #ccc';
      el.style.borderRadius = '8px';
      el.style.fontSize = '16px';
      el.style.fontWeight = '800';
      el.style.color = '#333';
      el.textContent = q.code;
    }
  });
}

// ════════════════════════════════════════════════
//  유틸
// ════════════════════════════════════════════════
function go(view) {
  if (S.view === 'scan') stopQrScan();
  if (S.view === 'arrived' && S.flashOn) { torchOff(); S.flashOn = false; }
  S.view = view;
  render();
  window.scrollTo(0, 0);
}

//  초기화
// ════════════════════════════════════════════════
initFirebase();
render();
</script>
