*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070b14;--card:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.07);--text:#e8e6e3;--sub:rgba(200,210,230,0.45);--dim:rgba(200,210,230,0.25);--blue:#2d4a8a;--gold:#8a6d2d;--accent:#ffd07a}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
#app{min-height:100vh;background:linear-gradient(170deg,#070b14 0%,#0e1528 40%,#0a1020 100%);position:relative}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:20px 16px;min-height:100vh;display:flex;flex-direction:column}
.wrap.center{justify-content:center;align-items:center;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;backdrop-filter:blur(12px)}
.btn{width:100%;padding:14px 20px;background:linear-gradient(135deg,var(--blue),#1a3066);border:1px solid rgba(100,140,255,0.3);border-radius:12px;color:#e0e8ff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(0.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#66501a);border-color:rgba(255,200,100,0.3);color:#fff3d4}
.btn-off{opacity:.35;cursor:not-allowed}
.btn-sm{padding:10px 16px;font-size:13px}
.title{font-size:28px;font-weight:800;background:linear-gradient(135deg,#c8d8ff,#ffd4a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:-.5px}
.back-btn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px;margin-bottom:16px;font-family:inherit;text-align:left;padding:0}
.input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e0e8ff;font-size:14px;font-family:inherit;outline:none}
.input:focus{border-color:rgba(100,140,255,0.4)}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;transition:all .3s}
.dot.done{background:#6faaff}
.dot.active{background:#ffd07a;box-shadow:0 0 8px rgba(255,208,122,.5)}
.dot.idle{background:rgba(255,255,255,.12)}
.option-btn{width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#e0e8ff;font-size:15px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.option-btn:active{background:rgba(255,255,255,0.08)}
.option-btn.correct{background:rgba(80,200,120,0.2);border-color:rgba(80,200,120,0.5)}
.option-btn.wrong{background:rgba(255,80,80,0.2);border-color:rgba(255,80,80,0.5);animation:shake .3s ease}
.option-btn.locked{opacity:.4;pointer-events:none}
.penalty-bar{width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:16px;overflow:hidden}
.penalty-fill{height:100%;background:linear-gradient(90deg,#ff6b6b,#ffa94d);border-radius:2px;transition:width 0.1s linear}
.team-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.team-btn{padding:14px 8px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;font-family:inherit;color:#e0e8ff}
.team-btn.sel{background:rgba(255,255,255,0.06)}
.team-circle{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.badge{padding:3px 10px;border-radius:16px;font-size:11px;border:1px solid}
.badge-on{background:rgba(80,200,120,0.15);color:#6fdf8a;border-color:rgba(80,200,120,0.25)}
.badge-off{background:rgba(255,255,255,0.04);color:var(--sub);border-color:rgba(255,255,255,0.06)}
.badge-taken{background:rgba(255,80,80,0.1);color:rgba(255,130,130,0.7);border-color:rgba(255,80,80,0.2)}
.team-btn.taken{opacity:.35;pointer-events:none;position:relative}
.team-btn.taken::after{content:'등록됨';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,130,130,0.7)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:#1a1f30;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;max-width:340px;width:100%}
.flash-circle{width:110px;height:110px;border-radius:50%;margin:16px auto;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;font-size:36px}
.flash-off{background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.1)}

#qr-reader{width:100%;max-width:280px;margin:0 auto 16px;border-radius:12px;overflow:hidden}
#qr-reader video{border-radius:12px}
/* 별 배경 */
.starfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
/* QR 인쇄 */
.qr-print-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qr-item{text-align:center;padding:12px;background:white;border-radius:8px;break-inside:avoid}
.qr-item canvas{display:block;margin:0 auto 8px}
.qr-item p{color:#333;font-size:12px;font-weight:600;margin:0}
.qr-item small{color:#666;font-size:10px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media print{.no-print{display:none!important}.qr-print-grid{grid-template-columns:1fr 1fr 1fr}}

const QUIZZES_B = QUIZZES.map(aq => [
  // B Stage 0: A의 Q3(질문) + A의 L2(힌트/QR) → L2로 먼저 감
  { question: aq[2].question, options: aq[2].options, answer: aq[2].answer, hint: aq[1].hint, qrId: aq[1].qrId },
  // B Stage 1: A의 Q1(질문) + A의 L1(힌트/QR) → L1으로 감
  { question: aq[0].question, options: aq[0].options, answer: aq[0].answer, hint: aq[0].hint, qrId: aq[0].qrId },
  // B Stage 2: A의 Q2(질문) + A의 Final(힌트/QR) → 선생님(최종)으로 감
  { question: aq[1].question, options: aq[1].options, answer: aq[1].answer, hint: aq[2].hint, qrId: aq[2].qrId },
]);
// 전체 20팀 퀴즈: 0-9=A조, 10-19=B조
function getQuiz(teamIdx, stage) {
  if (teamIdx < 10) return QUIZZES[teamIdx][stage];
  return QUIZZES_B[teamIdx - 10][stage];
}
// 팀 인덱스 → 조/번호/별자리 위치
function teamGroup(t) { return t < 10 ? 'A' : 'B'; }
function teamNum(t) { return (t % 10) + 1; }
function teamLabel(t) { return `${teamGroup(t)}-${teamNum(t)}`; }
function starIdx(t) { return t % 10; } // 별자리 위치 (0-9)

const LS_KEY = 'starnight_session';

function saveSession() {
  try {
    const data = { team: S.team, group: S.group, members: S.members, stage: S.stage, ts: Date.now() };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch(e) {}
}

function loadSession() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function clearSession() {
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
}

function restoreSession() {
  const saved = loadSession();
  if (!saved || saved.team === null || saved.team === undefined) return false;
  S.team = saved.team;
  S.group = saved.group || (saved.team < 10 ? 'A' : 'B');
  S.members = saved.members || ['','',''];
  S.stage = saved.stage || 0;
  if (db) {
    db.collection(COLLECTION).doc('team_' + S.team).get().then(doc => {
      if (doc.exists) {
        const d = doc.data();
        S.stage = d.currentStage || S.stage;
        S.members = d.members || S.members;
        if (d.arrived) {
          S.view = 'arrived';
        } else {
          S.view = 'quiz';
        }
        listenTeams();
        listenState();
        render();
      } else {
        clearSession();
        S.team = null; S.group = null;
        S.view = 'splash';
        render();
      }
    }).catch(() => {
      S.view = 'quiz';
      render();
    });
    return true;
  }
  return false;
}

async function resetGame() {

  const batch = db.batch();
  batch.set(db.collection(COLLECTION).doc('_state'), { messageSent: false, photoUrl: '' });
  for (let i = 0; i < 20; i++) {

// 실시간 리스너: 팀 상태
function listenTeams() {
  if (!db) return;
  if (unsubTeams) unsubTeams();
  unsubTeams = db.collection(COLLECTION).onSnapshot(snap => {
      const newArrived = Array(20).fill(false);
      const newRegistered = Array(20).fill(false);
      const teamData = {};
      snap.forEach(doc => {
        if (doc.id === '_state') return;
        const d = doc.data();
        const idx = d.teamIndex;
        if (idx !== undefined && idx >= 0 && idx < 20) {
          newArrived[idx] = !!d.arrived;
          newRegistered[idx] = true;
          teamData['team_' + idx] = d;
        }
      });
      S.arrived = newArrived;
      S.registeredTeams = newRegistered;
      S.teamData = teamData;
      if (S.view !== 'scan') render();
    });
}

// 실시간 리스너: 게임 상태 (메시지/사진)
function listenState() {
  if (!db) return;
  unsubState = db.collection(COLLECTION).doc('_state').onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      S.msgSent = !!d.messageSent;
      S.photoUrl = d.photoUrl || '';
      if (S.view !== 'scan') render();
    }
  });
}

// ════════════════════════════════════════════════
let qrScanner = null;
let qrStopping = false;

function startQrScan(onResult) {
  const el = document.getElementById('qr-reader');
  if (!el || qrStopping) return;
  try {
    qrScanner = new Html5Qrcode('qr-reader');
    qrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decoded) => {
        const code = decoded.trim();
        stopQrScan();
        onResult(code);
      },
      () => {}
    ).catch(err => {
      console.warn('카메라 접근 실패:', err);
      // 카메라 실패해도 render 하지 않음 — 수동 입력이 이미 표시되어 있음
      qrScanner = null;
    });
  } catch(e) {
    console.warn('QR 초기화 실패:', e);
    qrScanner = null;
  }
}

function stopQrScan() {
  if (qrStopping) return;
  const scanner = qrScanner;
  qrScanner = null;
  if (!scanner) return;
  qrStopping = true;
  try {
    scanner.stop().then(() => {
      try { scanner.clear(); } catch(e) {}
      qrStopping = false;
    }).catch(() => {
      try { scanner.clear(); } catch(e) {}
      qrStopping = false;
    });
  } catch(e) {
    qrStopping = false;
  }
}

// ════════════════════════════════════════════════
//  별자리 SVG (관리자 전용)
// ════════════════════════════════════════════════
function constellationSVG(arr, width) {
  const w = width || 360;
  let svg = `<svg viewBox="-10 -10 520 450" width="${w}" style="margin:0 auto;display:block">`;
  // 삼각형 점선
  TRI_LINES.forEach(([a,b]) => {
    const on = arr[a] && arr[b];
    svg += `<line x1="${POS[a].x}" y1="${POS[a].y}" x2="${POS[b].x}" y2="${POS[b].y}" stroke="${on?'rgba(255,200,100,0.25)':'rgba(255,255,255,0.05)'}" stroke-width="1" stroke-dasharray="8,6"/>`;
  });
  // 백조자리 실선
  CYGNUS_LINES.forEach(([a,b]) => {
    const on = arr[a] && arr[b];
    svg += `<line x1="${POS[a].x}" y1="${POS[a].y}" x2="${POS[b].x}" y2="${POS[b].y}" stroke="${on?'rgba(180,210,255,0.5)':'rgba(255,255,255,0.07)'}" stroke-width="${on?2:1}" stroke-dasharray="${on?'none':'4,4'}"/>`;
  });
  // 별
  POS.forEach((p,i) => {
    if (arr[i]) {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="16" fill="none" stroke="rgba(255,220,100,0.3)" stroke-width="1"><animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;.1;.4" dur="2s" repeatCount="indefinite"/></circle>`;
    }
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${arr[i]?6:3.5}" fill="${arr[i]?'#ffd54f':'rgba(255,255,255,0.18)'}" style="transition:all .5s;${arr[i]?'filter:drop-shadow(0 0 5px rgba(255,213,79,0.7))':''}"/>`;
    svg += `<text x="${p.x}" y="${p.y-12}" text-anchor="middle" font-size="10" fill="${arr[i]?'#ffd07a':'rgba(255,255,255,0.2)'}" font-family="'Noto Sans KR',sans-serif">${i+1}모둠</text>`;
    svg += `<text x="${p.x}" y="${p.y+18}" text-anchor="middle" font-size="8" fill="${arr[i]?'rgba(255,208,122,0.6)':'rgba(255,255,255,0.12)'}" font-family="'Noto Sans KR',sans-serif">${STARS_ADMIN[i].ko}</text>`;
  });
  svg += `<text x="250" y="435" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.12)" font-family="'Noto Sans KR',sans-serif">여름 대삼각형 + 백조자리</text>`;
  svg += `</svg>`;
  return svg;
}

let penaltyInterval = null;
function clearPenalty() {
  if (penaltyInterval) { clearInterval(penaltyInterval); penaltyInterval = null; }
  S.penalty = false; S.penaltyCount = 0;
}

function renderQuiz() {
  clearPenalty();
  const q = getQuiz(S.team, S.stage);
  const isFinal = S.stage === 2;
  const c = COLORS[S.team % 10];
  app().innerHTML = starFieldSVG() + `
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span class="tag" style="background:${c}20;border:1px solid ${c}40;color:${c}">${teamLabel(S.team)}</span>
      <div style="display:flex;gap:6px">${[0,1,2].map(i => `<div class="dot ${i===S.stage?'active':i<S.stage?'done':'idle'}"></div>`).join('')}</div>
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--dim);margin-bottom:8px">${isFinal?'🌟 마지막 문제':`문제 ${S.stage+1} / 3`}</div>
      <h3 style="font-size:18px;font-weight:700;line-height:1.6;margin-bottom:24px">${q.question}</h3>
      <div id="options-area" style="display:flex;flex-direction:column;gap:10px">
        ${q.options.map((o,i) => `<button class="option-btn" data-idx="${i}"><span style="margin-right:8px;opacity:.35">${['A','B','C','D'][i]}</span>${o}</button>`).join('')}
      </div>
      <div id="penalty-area" style="display:none">
        <div class="penalty-bar"><div class="penalty-fill" id="penalty-fill" style="width:100%"></div></div>
        <p id="penalty-text" style="font-size:13px;color:#ff8a8a;text-align:center;margin-top:8px">오답! 10초 후 다시 시도할 수 있습니다</p>
      </div>
    </div>
  </div>`;

  let locked = false;
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      if (locked) return;
      const idx = +this.dataset.idx;
      if (idx === q.answer) {
        locked = true;
        this.classList.add('correct');
        clearPenalty();
        setTimeout(() => go('hint'), 1200);
      } else {
        this.classList.add('wrong');
        locked = true;
        // 10초 패널티
        const pa = $('penalty-area');
        const pf = $('penalty-fill');
        const pt = $('penalty-text');
        if (pa) pa.style.display = 'block';
        document.querySelectorAll('.option-btn').forEach(b => b.classList.add('locked'));
        let remaining = 100; // 10초 = 100 × 100ms
        penaltyInterval = setInterval(() => {
          remaining--;
          const sec = Math.ceil(remaining / 10);
          if (pf) pf.style.width = remaining + '%';
          if (pt) pt.textContent = `오답! ${sec}초 후 다시 시도할 수 있습니다`;
          if (remaining <= 0) {
            clearInterval(penaltyInterval);
            penaltyInterval = null;
            locked = false;
            if (pa) pa.style.display = 'none';
            document.querySelectorAll('.option-btn').forEach(b => {
              b.classList.remove('locked');
              b.classList.remove('wrong');
            });
          }
        }, 100);
      }
    });
  });
}

// ── QR 스캔 ──
function renderScan() {
  const q = getQuiz(S.team, S.stage);
  app().innerHTML = starFieldSVG() + `
  <div class="wrap center">
    <div class="card" style="text-align:center">
      <div style="font-size:36px;margin-bottom:12px">📷</div>
      <h3 style="font-size:18px;font-weight:700;margin-bottom:8px">QR코드 스캔</h3>
      <p style="font-size:13px;color:var(--dim);margin-bottom:16px">목적지의 QR코드를 카메라로 비춰주세요</p>
      <div id="qr-reader"></div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <p style="font-size:12px;color:var(--dim);margin-bottom:8px">카메라가 안 될 경우 코드를 직접 입력하세요</p>
        <input id="qr-manual" class="input" style="text-align:center;margin-bottom:8px" placeholder="QR 코드 입력">
        <button id="qr-manual-btn" class="btn btn-sm">확인</button>
      </div>
    </div>
    <button class="back-btn" style="text-align:center;margin-top:16px" id="scan-back-btn">← 힌트 다시 보기</button>
  </div>`;

  const handleResult = (code) => {
    if (code === q.qrId) {
      if (S.stage === 2) {
        markArrived(S.team);
        S.arrived[S.team] = true;
        saveSession();
        go('arrived');
      } else {
        S.stage++;
        updateStage(S.team, S.stage);
        saveSession();
        go('quiz');
      }
    } else {
      go('wrong');
    }
  };

  // 뒤로가기
  $('scan-back-btn').addEventListener('click', () => go('hint'));

  // 수동 입력
  const mi = $('qr-manual'), mb = $('qr-manual-btn');
  mb.addEventListener('click', () => { if (mi.value.trim()) handleResult(mi.value.trim()); });
  mi.addEventListener('keydown', e => { if (e.key === 'Enter' && mi.value.trim()) handleResult(mi.value.trim()); });

  // 카메라 스캔 시도 (현재 뷰가 scan일 때만)
  setTimeout(() => {
    if (S.view === 'scan') {
      try { startQrScan(handleResult); } catch(e) { console.warn('QR 스캔 시작 실패', e); }
    }
  }, 300);
}

          <p style="font-size:11px;color:var(--dim);margin-bottom:12px">${STARS_ADMIN[si].ko} (${STARS_ADMIN[si].en}) · ${STARS_ADMIN[si].part}</p>
          ${members.length > 0 ? members.map((m,j) => `
            <div style="padding:8px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;margin-bottom:6px;font-size:14px">
              <span style="color:var(--dim);margin-right:8px">${j+1}.</span>${m}
            </div>
          `).join('') : '<p style="color:var(--dim);font-size:13px">등록된 구성원이 없습니다</p>'}
        `;
        modal.style.display = 'flex';
      }
    });
  });

  const sendBtn = $('send-msg-btn');
  if (sendBtn && allOk) sendBtn.addEventListener('click', () => { sendMessage(); S.msgSent = true; render(); });

  const photoBtn = $('photo-btn');
  const photoInput = $('photo-input');
  if (photoBtn && photoInput) {
    photoBtn.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      photoBtn.textContent = '업로드 중...';
      photoBtn.classList.add('btn-off');
      try {
        const url = await uploadPhoto(file);
        if (url) { S.photoUrl = url; render(); }
      } catch(err) {
        S.photoUrl = URL.createObjectURL(file);
        render();
      }
    });
  }

  const resetBtn = $('reset-btn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (confirm('정말로 모든 게임 데이터를 초기화하시겠습니까?\n\n학생 기기의 세션은 다음 접속 시 자동으로 초기화됩니다.')) {
      resetGame();
      clearSession();
      S.arrived = Array(20).fill(false);
      S.registeredTeams = Array(20).fill(false);
      S.msgSent = false;
      S.photoUrl = '';
      S.teamData = {};
      render();
    }
  });
}

// ── 관리자 QR코드 ──
function renderAdminQr() {
  // 모든 QR코드 목록 생성
  let qrList = [];
  QUIZZES.forEach((teamQ, ti) => {
    teamQ.forEach((q, si) => {
      qrList.push({
        code: q.qrId,
        team: ti + 1,
        stage: si === 3 ? '최종' : `${si+1}단계`,
        hint: q.hint.replace(/[📚🔬🎵🎨🍽️💻🏃📺⭐]/g, '').trim()
      });
    });
  });

  app().innerHTML = `
  <div class="wrap no-print">
    <button class="back-btn" onclick="go('admin')">← 관리자 패널</button>
    <h2 class="title">🏷️ QR코드 관리</h2>
    <p style="font-size:14px;color:var(--sub);margin-bottom:16px;line-height:1.5">각 QR코드를 인쇄하여 해당 장소에 부착하세요</p>
    <button class="btn" style="margin-bottom:24px" onclick="window.print()">🖨️ 인쇄하기</button>
  </div>
  <div class="qr-print-grid" style="max-width:800px;margin:0 auto;padding:0 16px 40px" id="qr-grid">
    ${qrList.map(q => `
      <div class="qr-item">
        <div id="qr-${q.code}" style="margin:0 auto 8px;width:150px;height:150px"></div>
        <p>${q.team}모둠 ${q.stage}</p>
        <p style="font-size:14px;font-weight:800;color:#000;margin-top:4px">${q.code}</p>
        <small>${q.hint.substring(0, 30)}...</small>
      </div>
    `).join('')}
  </div>`;

  // QR코드 생성 (html5-qrcode의 QR 생성은 별도 라이브러리 필요하므로 canvas로 간단 구현)
  qrList.forEach(q => {
    const el = document.getElementById('qr-' + q.code);
    if (el && typeof QRCode !== 'undefined') {
      new QRCode(el, { text: q.code, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
    } else if (el) {
      // QRCode 라이브러리 없으면 텍스트 표시
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      el.style.border = '2px dashed #ccc';
      el.style.borderRadius = '8px';
      el.style.fontSize = '16px';
      el.style.fontWeight = '800';
      el.style.color = '#333';
      el.textContent = q.code;
    }
  });
}

// ════════════════════════════════════════════════
//  유틸
// ════════════════════════════════════════════════
function go(view) {
  if (S.view === 'scan') stopQrScan();
  if (S.view === 'quiz') clearPenalty();
  S.view = view;
  render();
  window.scrollTo(0, 0);
}

// ════════════════════════════════════════════════
//  초기화
// ════════════════════════════════════════════════
initFirebase();
// 세션 복원 시도 → 실패하면 스플래시
if (!restoreSession()) {
  // 모둠 선택 화면에서도 등록 현황 확인 필요
  listenTeams();
  render();
}
</script>
